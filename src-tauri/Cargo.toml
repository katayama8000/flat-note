[package]
name = "flat-note"
version = "0.1.0"
description = "A simple note-taking app built with Tauri and Rust."
authors = ["katayama8000 <tattu.0310@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flat_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = [
    "src/crates/infrastructure",
    "src/crates/domain",
    "src/crates/usecase",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json = "1"
uuid = { version = "1.23.0", features = ["v4"] }
domain = { path = "src/crates/domain" }
usecase = { path = "src/crates/usecase" }
infrastructure = { path = "src/crates/infrastructure" }

